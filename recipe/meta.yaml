{% set name = "retina-face" %}
{% set version = "0.0.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 24dc048609562d7dd71b2180215e2e437f1e752514bf27b2cc3dd3af61cf3406

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - onnxruntime >=1.13.0
    - opencv-contrib-python-headless >=4.5.5.64
    - requests >=2.27.1
    - gdown >=3.10.1
    - numpy >=1.14.0
    - opencv >=3.4.4
    - pillow >=5.2.0
    - python >={{ python_min }}
    - tensorflow >=1.9.0

test:
  imports:
    - retinaface
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/serengil/retinaface
  summary: 'RetinaFace: Deep Face Detection Framework in TensorFlow for Python'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - serengil
    - BastianZim
